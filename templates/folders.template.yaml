# Google Sheets folder registry — generated by setup.sh
# Contains personal Google Drive IDs — NOT committed to the repo.
# Update month entries as new folders are created.

apps_script_url: "__APPS_SCRIPT_URL__"
template_id: "__TEMPLATE_ID__"

# root_folder_id = top-level reports folder. Holds one subfolder per YEAR (2026, 2027, ...).
# Month folders must NEVER be created directly here — they go inside year_folder_id.
root_folder_id: "__ROOT_FOLDER_ID__"

# year = the year that year_folder_id and the months map below describe.
# year_folder_id = the subfolder for that year inside root. All month folders live here.
# On the first report of a new year, the skill performs "Year rollover" (see SKILL.md):
# it creates the new year folder inside root and resets months to {}.
year: 2026
year_folder_id: "__YEAR_FOLDER_ID__"
months: {}
