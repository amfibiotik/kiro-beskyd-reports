# Kiro Work Config — generated by setup.sh
# Do not commit this file (contains personal info)

worker_id: "__WORKER_ID__"
full_name: "__FULL_NAME__"
activity: "Soft. Dev"
default_hours: 8
projects:
  __PROJECT_KEY__: "__PROJECT_NAME__"

# Where the skills read/write local data. Global dirs — independent of which
# project directory the CLI was launched from.
work_log_dir: "~/.kiro/work-planning/work-log"
sessions_dir: "~/.kiro/work-planning/sessions"
reports_dir: "~/.kiro/work-planning/reports"
# Optional: old session location kept for historical lookups. Remove if unused.
# legacy_sessions_dir: "~/some-old-project/.planning/sessions"

# How to save reports to Google Sheets.
# Ask the user: "Do you organize reports in monthly subfolders, one folder for everything, or not use Google Sheets at all?"
#
# Options:
#   monthly_folders — creates subfolders per month (e.g. "06-June/") inside root_folder_id
#   single_folder  — saves all reports directly into root_folder_id, no subfolders
#   none           — skip Google Sheets entirely, only show report in terminal + save local file
sheets_mode: "monthly_folders"
